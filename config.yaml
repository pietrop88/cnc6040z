board: ESP32 Dev Controller V4
name: CNC 6040Z
verbose_errors: true

kinematics:
  Cartesian:

start:
  must_home: false
  deactivate_parking: true
  check_limits: true

stepping:
  engine: RMT
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 0
  disable_delay_us: 0
  segments: 12

axes:
  homing_runs: 2
  x:
    steps_per_mm: 400.0
    max_rate_mm_per_min: 1000.0
    acceleration_mm_per_sec2: 25.0
    max_travel_mm: 60000.0
    soft_limits: true
    homing:
      cycle: 2
      positive_direction: false
    motor0:
      limit_neg_pin: gpio.4:high:pu
      hard_limits: true
      pulloff_mm: 1.0
      standard_stepper:
        step_pin: gpio.14
        direction_pin: gpio.12
  y:
    steps_per_mm: 400.0
    max_rate_mm_per_min: 1000.0
    acceleration_mm_per_sec2: 25.0
    max_travel_mm: 40000.0
    soft_limits: true
    homing:
      cycle: 2
      positive_direction: false
    motor0:
      limit_neg_pin: gpio.17:high:pu
      hard_limits: true
      pulloff_mm: 1.0
      standard_stepper:
        step_pin: gpio.33
        direction_pin: gpio.27
  z:
    steps_per_mm: 400.0
    max_rate_mm_per_min: 1000.0
    acceleration_mm_per_sec2: 25.0
    max_travel_mm: 10
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: true
    motor0:
      limit_pos_pin: gpio.16:high:pu
      hard_limits: true
      pulloff_mm: 1.0
      standard_stepper:
        step_pin: gpio.15
        direction_pin: gpio.26:low

uart1:
  txd_pin: gpio.18
  rxd_pin: gpio.19
  rts_pin: gpio.21
  baud: 9600
  mode: 8N1

NowForever:
  uart_num: 1
  modbus_id: 1
  tool_num: 0
  speed_map: 0=0% 24000=100%
  off_on_alarm: false

parking:
  enable: false
